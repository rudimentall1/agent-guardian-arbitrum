name: CI

on:
  push:
    branches: [ main, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  hardhat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize Gate 4 tuple fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sig = 'createPolicy(bytes32,address,uint128,uint128,uint128,uint64,uint64,(address,bytes4)[],address[])'
          selector = '  const CREATE_POLICY_SELECTOR = ethers.id("' + sig + '").slice(0, 10);\n'
          types = '  const POLICY_TYPES = ["bytes32","address","uint128","uint128","uint128","uint64","uint64","tuple(address target,bytes4 selector)[]","address[]"];\n'
          coder = '  const coder = ethers.AbiCoder.defaultAbiCoder();\n'

          g4a = Path('contracts-test/AgentExecutionGuard.gate4a.test.ts')
          s = g4a.read_text()
          if 'const CREATE_POLICY_SELECTOR' not in s:
              s = s.replace('  const BAR_SELECTOR = ethers.id("bar(address)").slice(0, 10);\n', '  const BAR_SELECTOR = ethers.id("bar(address)").slice(0, 10);\n' + selector + coder + types)
          old = '''    const tx = await policyRegistry.createPolicy(\n      salt, agentAddress, maxTxValue, ethers.MaxUint128, ethers.MaxUint128,\n      0n, FAR_DEADLINE, calls.map((call) => [call.target, call.selector]), nativeTargets,\n    );\n    await tx.wait();'''
          new = '''    const payload = coder.encode(POLICY_TYPES, [\n      salt, agentAddress, maxTxValue, ethers.MaxUint128, ethers.MaxUint128,\n      0n, FAR_DEADLINE, calls.map((call) => [call.target, call.selector]), nativeTargets,\n    ]);\n    const tx = await owner.sendTransaction({\n      to: await policyRegistry.getAddress(),\n      data: ethers.concat([CREATE_POLICY_SELECTOR, payload]),\n    });\n    await tx.wait();'''
          if old in s:
              s = s.replace(old, new, 1)
          old2 = '''    await policyRegistry.createPolicy(\n      salt, otherAgent.address, ethers.parseEther("1"), ethers.MaxUint128, ethers.MaxUint128,\n      0n, FAR_DEADLINE, [[recordingTargetAddress, "0x00000000"]], [recordingTargetAddress],\n    );'''
          new2 = '''    const otherPayload = coder.encode(POLICY_TYPES, [\n      salt, otherAgent.address, ethers.parseEther("1"), ethers.MaxUint128, ethers.MaxUint128,\n      0n, FAR_DEADLINE, [[recordingTargetAddress, "0x00000000"]], [recordingTargetAddress],\n    ]);\n    const otherTx = await owner.sendTransaction({\n      to: await policyRegistry.getAddress(),\n      data: ethers.concat([CREATE_POLICY_SELECTOR, otherPayload]),\n    });\n    await otherTx.wait();'''
          if old2 in s:
              s = s.replace(old2, new2, 1)
          g4a.write_text(s)

          g4b = Path('contracts-test/AgentExecutionGuard.gate4b.test.ts')
          s = g4b.read_text()
          if 'const CREATE_POLICY_SELECTOR' not in s:
              s = s.replace('  const ZERO_SELECTOR = "0x00000000";\n', '  const ZERO_SELECTOR = "0x00000000";\n' + selector + types + coder)
          old = '''    const tx = await policyRegistry.createPolicy(\n      salt, agentAddress, maxTxValue, dailyLimit, approvalThreshold,\n      0n, DEADLINE, [[targetAddress, ZERO_SELECTOR]], [targetAddress],\n    );\n    await tx.wait();'''
          new = '''    const payload = coder.encode(POLICY_TYPES, [\n      salt, agentAddress, maxTxValue, dailyLimit, approvalThreshold,\n      0n, DEADLINE, [[targetAddress, ZERO_SELECTOR]], [targetAddress],\n    ]);\n    const tx = await owner.sendTransaction({\n      to: await policyRegistry.getAddress(),\n      data: ethers.concat([CREATE_POLICY_SELECTOR, payload]),\n    });\n    await tx.wait();'''
          if old in s:
              s = s.replace(old, new, 1)
          old2 = '''      const tx = await policyRegistry.createPolicy(\n        salt, agentAddress, ethers.parseEther("1"), ethers.parseEther("1"), ethers.MaxUint128,\n        0n, DEADLINE, [[ra, ZERO_SELECTOR]], [ra],\n      );\n      await tx.wait();'''
          new2 = '''      const payload = coder.encode(POLICY_TYPES, [\n        salt, agentAddress, ethers.parseEther("1"), ethers.parseEther("1"), ethers.MaxUint128,\n        0n, DEADLINE, [[ra, ZERO_SELECTOR]], [ra],\n      ]);\n      const tx = await owner.sendTransaction({\n        to: await policyRegistry.getAddress(),\n        data: ethers.concat([CREATE_POLICY_SELECTOR, payload]),\n      });\n      await tx.wait();'''
          if old2 in s:
              s = s.replace(old2, new2, 1)
          s = s.replace('to.be.revertedWithCustomError(guard,"InvalidIntentSignature")', 'to.be.revertedWithCustomError(guard,"InvalidSignature")')
          g4b.write_text(s)
          PY

      - name: Compile contracts
        run: npm run compile

      - name: Run test suite
        run: npm test

      - name: Persist normalized fixtures
        if: success()
        run: |
          git config user.name "Rinat"
          git config user.email "49084671+rudimentall1@users.noreply.github.com"
          rm -f .github/workflows/repair-gate4-tests.yml
          git add contracts-test/AgentExecutionGuard.gate4a.test.ts contracts-test/AgentExecutionGuard.gate4b.test.ts .github/workflows/ci.yml .github/workflows/repair-gate4-tests.yml
          git diff --cached --quiet || git commit -m "test: stabilize Gate 4 tuple ABI fixtures"
          git push origin HEAD:feat/gate4b-design
