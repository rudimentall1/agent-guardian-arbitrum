name: Hardhat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hardhat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile from a clean build
        run: npm run compile

      - name: Run Hardhat test suite
        run: npm run test:hardhat
