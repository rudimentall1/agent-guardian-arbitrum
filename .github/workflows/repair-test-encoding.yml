name: Repair test encoding

on:
  push:
    branches: [feat/gate4b-design]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'test: stabilize gate4 tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gate4b-design
          fetch-depth: 0
      - name: Patch Gate 4 test helpers and selectors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('contracts-test/AgentExecutionGuard.gate4a.test.ts')
          s = p.read_text()
          s = s.replace('const fooSel = selectorTarget.interface.getFunction("foo")!.selector;', 'const fooSel = ethers.id("foo(uint256)").slice(0, 10);')
          s = s.replace('const barSel = selectorTarget.interface.getFunction("bar")!.selector;', 'const barSel = ethers.id("bar(address)").slice(0, 10);')
          s = s.replace('const barSel = otherTarget.interface.getFunction("bar")!.selector;', 'const barSel = ethers.id("bar(address)").slice(0, 10);')
          s = s.replace('selector: attacker.interface.getFunction("attack")!.selector', 'selector: "0xaaaaaaaa"')
          s = s.replace('const data = attacker.interface.encodeFunctionData("attack");', 'const data = "0xaaaaaaaa";')
          p.write_text(s)

          p = Path('contracts-test/AgentExecutionGuard.gate4b.test.ts')
          s = p.read_text()
          old = '''    const encoded = policyRegistry.interface.encodeFunctionData("createPolicy", [
      salt,
      agent.address,
      maxTxValue,
      dailyLimit,
      approvalThreshold,
      0n,
      FAR_DEADLINE,
      [],
      [targetAddressForPolicy],
    ]);
    const tx = await owner.sendTransaction({
      to: await policyRegistry.getAddress(),
      data: encoded,
    });
    await tx.wait();'''
          new = '''    await policyRegistry.connect(owner).createPolicy(
      salt,
      agent.address,
      maxTxValue,
      dailyLimit,
      approvalThreshold,
      0n,
      FAR_DEADLINE,
      [{ target: targetAddressForPolicy, selector: "0x00000000" }],
      [targetAddressForPolicy]
    );'''
          if old not in s:
              raise SystemExit('Gate 4B encoding helper pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -rf typechain-types artifacts cache
          git add contracts-test/AgentExecutionGuard.gate4a.test.ts contracts-test/AgentExecutionGuard.gate4b.test.ts
          git rm -f .github/workflows/repair-test-encoding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: stabilize gate4 tests"
          git push origin HEAD:feat/gate4b-design
