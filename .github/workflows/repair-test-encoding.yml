name: Repair test encoding

on:
  push:
    branches: [feat/gate4b-design]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'test: stabilize policy creation encoding across CI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gate4b-design
          fetch-depth: 0
      - name: Patch test helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('contracts-test/AgentExecutionGuard.gate4a.test.ts')
          s = p.read_text()
          old = '''      opts.maxTxValue ?? ethers.parseEther("1"),
      ethers.MaxUint128,
      ethers.parseEther("50"),
      opts.validFrom ?? 0n,
      opts.validUntil ?? FAR_DEADLINE,
      (opts.calls ?? []).map(({ target, selector }) => [target, selector]),'''
          new = '''      opts.maxTxValue ?? ethers.parseEther("1"),
      ethers.MaxUint128,
      ethers.MaxUint128,
      opts.validFrom ?? 0n,
      opts.validUntil ?? FAR_DEADLINE,
      opts.calls ?? [],'''
          if old not in s:
              raise SystemExit('Gate 4A helper pattern not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('contracts-test/AgentExecutionGuard.gate4b.test.ts')
          s = p.read_text()
          old = '''    await policyRegistry.connect(owner).createPolicy(
      salt,
      agent.address,
      maxTxValue,
      dailyLimit,
      approvalThreshold,
      0n,
      FAR_DEADLINE,
      [],
      [targetAddressForPolicy]
    );'''
          new = '''    const encoded = policyRegistry.interface.encodeFunctionData("createPolicy", [
      salt,
      agent.address,
      maxTxValue,
      dailyLimit,
      approvalThreshold,
      0n,
      FAR_DEADLINE,
      [],
      [targetAddressForPolicy],
    ]);
    const tx = await owner.sendTransaction({
      to: await policyRegistry.getAddress(),
      data: encoded,
    });
    await tx.wait();'''
          if old not in s:
              raise SystemExit('Gate 4B helper pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY

          rm -rf typechain-types artifacts cache
          git add contracts-test/AgentExecutionGuard.gate4a.test.ts contracts-test/AgentExecutionGuard.gate4b.test.ts
          git rm -f .github/workflows/repair-test-encoding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: stabilize policy creation encoding across CI"
          git push origin HEAD:feat/gate4b-design
