name: One-shot Gate 4 test normalization

on:
  push:
    branches: [feat/gate4b-design]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.head_commit.message != 'test: stabilize Gate 4 tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gate4b-design
          fetch-depth: 0
      - name: Normalize Gate 4 test ABI usage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('contracts-test/AgentExecutionGuard.gate4a.test.ts')
          s = p.read_text()
          replacements = {
              'selectorTarget.interface.getFunction("foo")!.selector': 'ethers.id("foo(uint256)").slice(0, 10)',
              'selectorTarget.interface.getFunction("bar")!.selector': 'ethers.id("bar(address)").slice(0, 10)',
              'otherTarget.interface.getFunction("bar")!.selector': 'ethers.id("bar(address)").slice(0, 10)',
              'attacker.interface.getFunction("attack")!.selector': '"0xaaaaaaaa"',
              'attacker.interface.encodeFunctionData("attack")': '"0xaaaaaaaa"',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)

          p = Path('contracts-test/AgentExecutionGuard.gate4b.test.ts')
          s = p.read_text()
          old = '''    const encoded = policyRegistry.interface.encodeFunctionData("createPolicy", [
      salt,
      agent.address,
      maxTxValue,
      dailyLimit,
      approvalThreshold,
      0n,
      FAR_DEADLINE,
      [],
      [targetAddressForPolicy],
    ]);
    const tx = await owner.sendTransaction({
      to: await policyRegistry.getAddress(),
      data: encoded,
    });
    await tx.wait();'''
          new = '''    const coder = ethers.AbiCoder.defaultAbiCoder();
    const encoded = coder.encode(
      [
        "bytes32",
        "address",
        "uint128",
        "uint128",
        "uint128",
        "uint64",
        "uint64",
        "tuple(address target,bytes4 selector)[]",
        "address[]",
      ],
      [
        salt,
        agent.address,
        maxTxValue,
        dailyLimit,
        approvalThreshold,
        0n,
        FAR_DEADLINE,
        [],
        [targetAddressForPolicy],
      ]
    );
    const selector = ethers.id("createPolicy(bytes32,address,uint128,uint128,uint128,uint64,uint64,(address,bytes4)[],address[])").slice(0, 10);
    const tx = await owner.sendTransaction({
      to: await policyRegistry.getAddress(),
      data: ethers.concat([selector, encoded]),
    });
    await tx.wait();'''
          if old not in s:
              raise SystemExit('Gate 4B helper encode block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('.github/workflows/repair-test-encoding.yml')
          s = p.read_text()
          p.write_text(s)
          PY
          git add contracts-test/AgentExecutionGuard.gate4a.test.ts contracts-test/AgentExecutionGuard.gate4b.test.ts
          git rm -f .github/workflows/repair-test-encoding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: stabilize Gate 4 tests"
          git push origin HEAD:feat/gate4b-design
