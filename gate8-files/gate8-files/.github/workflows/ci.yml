name: CI

on:
  push:
    branches: [ main, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Compile + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run test suite
        run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  static-analysis:
    name: Slither
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        id: slither
        with:
          node-version: 22
          fail-on: high
          # No project-wide detector exclusions. The one legitimate
          # native-value forward (AgentExecutionGuard -> AgentSmartWallet
          # -> target, in the wallet-custody path) is guarded by policy,
          # nonce, signature, approval, and daily-limit checks, and by
          # AgentSmartWallet's own onlyExecutionGuard binding; if Slither
          # flags that specific line, suppress it there with a scoped
          # `// slither-disable-next-line arbitrary-send-eth` comment and
          # a one-line justification, not a blanket --exclude here. The
          # legacy execute()/executeWithApproval() entry points can no
          # longer send any value at all (see NativeTransferRequiresWalletCustody
          # in contracts/AgentExecutionGuard.sol), so they should no
          # longer trigger this detector either.
          slither-args: --filter-paths "node_modules|typechain-types" --exclude-dependencies
